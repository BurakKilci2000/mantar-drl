# ============================================================
# mantar-drl yapılandırma dosyası (sürüm 0.1)
# Kodda sabit değer yoktur; tüm ayarlanabilir parametreler buradadır.
#
# Her parametre grubunda "tur" alanı değerin nereden geldiğini söyler:
#   literatur   : kaynakta açıkça verilen değer (kaynak alanında künye ve sayfa)
#   turetilmis  : literatürdeki bir değerden hesaplanan değer (ör. süreden büyüme hızı)
#   varsayim    : mühendislik varsayımı; duyarlılık analizinde sınanacak
#   gecici      : yer tutucu; güncel kaynaktan alınıp değiştirilecek
# Raporda yalnızca "literatur" ve "turetilmis" değerler kaynaklı olarak sunulabilir.
# ============================================================

simulasyon:
  adim_saat: 4                 # Δt = 4 saat (öneri formu, 3.2)
  alt_adim_dakika: 15          # PID alt katmanının çalıştığı iç adım
  tur: varsayim

dis_hava:                      # TODO: Kocaeli için MGM iklim normalleriyle değiştirilecek
  sicaklik_ort_c: 15.0
  sicaklik_gunluk_genlik_c: 5.0
  sicaklik_gurultu_std_c: 1.0
  bagil_nem: 70.0
  bagil_nem_gurultu_std: 5.0
  co2_ppm: 420.0
  tur: gecici

oda:                           # 100 m² üretim alanı, 3 m yükseklik
  alan_m2: 100.0
  yukseklik_m: 3.0
  isi_kayip_w_k: 160.0         # duvar/tavan ısı kaybı katsayısı (UA)
  isil_kutle_carpani: 10.0     # havanın ısı sığasına eklenen raf, substrat ve duvar kütlesi
  isitma_maks_kw: 15.0
  sogutma_maks_kw: 15.0
  isi_pompasi_cop: 3.0
  sogutma_nem_alma_orani: 0.3  # soğutma gücünün nem almaya giden payı
  nemlendirici_maks_kg_saat: 10.0
  nemlendirici_kwh_kg: 0.1
  taze_hava_min_ach: 0.2       # sızıntı ve asgari havalandırma
  taze_hava_maks_ach: 4.0      # saatte oda hacminin kaç katı taze hava
  fan_kwh_m3: 0.0003
  tur: varsayim

pid:                           # alt katman PI denetleyici kazançları
  sicaklik_kp_w_k: 3000.0
  sicaklik_ki_w_kh: 1500.0
  nem_kp_kg_saat_yuzde: 0.3
  nem_ki_kg_saat2_yuzde: 0.05
  co2_kp_ach: 1.5              # 1000 ppm sapma başına ACH
  co2_ki_ach_h: 0.5
  tur: varsayim

substrat:
  kg_m2_islak: 15.0
  baslangic_nemi_yuzde: 66.0   # Jang vd. 2003 [14], s. 145–146: substrat nemi yaklaşık %65–67
  baslangic_nemi_kaynak: "[14] s. 145-146"
  misel_isi_w_kg: 1.0
  misel_co2_l_kg_saat: 0.1     # kalibrasyon: literatürdeki ticari CO2 ayar noktaları (≤ 1000 ppm) makul havalandırmayla (ACH ≤ 2) sağlanabilmeli
  buharlasma_kg_m2_saat: 0.05  # kuru havada (BN = 0) yüzeyden buharlaşma
  inkubasyon_buharlasma_carpani: 0.2   # torbalar kapalıyken buharlaşma daha az
  nem_opt: [60.0, 70.0]
  nem_tolerans: 8.0
  tur: varsayim

turler:
  # Kaynak numaraları: [12] Sánchez 2010, [13] Zhang vd. 2023, [14] Jang vd. 2003,
  # [S1] Sakamoto 2018 (Fungal Biol. Rev.), [S2] Kim vd. 2020 'Hwadam' (Korean J. Mycol.),
  # [S3] Rocha vd. 2025 (Horticulturae), [S4] Ángeles-Argáiz vd. 2025 (J. Appl. Microbiol., ek dosya),
  # [H1] Atila vd. 2021 (Sci. Hortic.), [H2] Gonkhom vd. 2024 (Chiang Mai J. Sci.), [H3] 'Chuanhougu 1-2' (Mycosystema, özet)
  # Ayrıntılar: belgeler/parametre_kaynaklari.md

  istiridye:                   # Pleurotus ostreatus
    inkubasyon:
      sicaklik_opt: [24.0, 26.0]     # 25 °C: [12] s. 1325; [14] s. 145
      sicaklik_tolerans: 4.0          # varsayım
      sure_gun: 13.0                  # 12–14 gün: [12] s. 1325 (Royse 2007'ye atıfla)
      co2_maks_ppm: null              # yüksek CO2 misel gelişimini engellemiyor: [14] Tablo 1, s. 147
      kolonizasyon_esigi: 0.90        # varsayım
      kaynak: "[12] s. 1325; [14] s. 145, 147"
    kahverengilesme: null             # istiridyede yok
    meyvelenme:
      sicaklik_opt: [13.0, 16.0]      # [14] s. 145 (Zhang [13] s. 154: 20–25 °C → suş farkı)
      sicaklik_tolerans: 3.0          # varsayım
      sus_sicaklik_kaymasi_c: 3.0     # her bölümde ±3 °C rastgele kayma (suş farkı; [13] ile [14] arasındaki fark)
      nem_opt: [80.0, 85.0]           # [14] s. 145; [12] Tablo 3, s. 1328
      nem_tolerans: 8.0               # varsayım
      co2_iyi_maks_ppm: 3000.0        # %0,3: [14] s. 145
      co2_kalite_esigi_ppm: 5000.0    # > %0,5 düşük kalite: [14] s. 145, Tablo 2 s. 147
      co2_sekil_bozulma_ppm: 10000.0  # ≥ %1 karnabahar biçimi: [13] s. 153
      kaynak: "[12] s. 1325, 1328; [13] s. 153-154; [14] s. 145, 147"
    biyoloji:
      biyolojik_verimlilik: [0.8, 0.8]   # varsayım (istiridye için BV kaynağı aranacak)
      dalga_paylari: [0.5, 0.3, 0.2]     # varsayım
      pin_gun: 3.0                       # varsayım
      buyume_gun: 5.0                    # varsayım
      hasat_opt_yas_gun: 5.0             # varsayım; şapka tamamen açılınca kalite düşer: [S1] s. 242
      kalite_dusus_gun: 0.15             # varsayım
      curume_yas_gun: 9.0                # varsayım
      dinlenme_gun: 7.0                  # varsayım
      maks_gun: 70.0
      tur: varsayim

  shiitake:                    # Lentinula edodes
    inkubasyon:
      sicaklik_opt: [20.0, 25.0]      # 20 ± 1 °C: [S2] s. 127; 25 ± 2 °C: [S3] s. 3
      sicaklik_tolerans: 4.0          # varsayım
      sure_gun: 35.0                  # [S2] Tablo 3, s. 130
      co2_maks_ppm: 5000.0            # ≤ 5000 ppm: [S2] s. 127
      kolonizasyon_esigi: 0.90        # varsayım
      kaynak: "[S2] s. 127, 130; [S3] s. 3"
    kahverengilesme:
      sure_gun: 84.0                  # [S2] Tablo 3, s. 130 ([S3] s. 3'te kolonizasyon + kahverengileşme toplam 80 gün)
      esik: 0.90                      # varsayım
      kaynak: "[S2] s. 127, 130; [S3] s. 3. Işık (≥ 200 lux) sabit program olarak varsayılır: [S2] s. 127; [S1] s. 240-241"
    meyvelenme:
      sicaklik_opt: [13.0, 19.0]      # 13–16 °C: [S2] s. 127; 19 ± 4 °C: [S3] s. 3
      sicaklik_tolerans: 3.0          # varsayım
      sus_sicaklik_kaymasi_c: 3.0     # suş × sıcaklık etkileşimi anlamlı: [S4] Tablo S10
      nem_opt: [85.0, 95.0]           # %85 ± 15: [S3] s. 3
      nem_tolerans: 8.0               # varsayım
      co2_iyi_maks_ppm: 1000.0        # ≤ 1000 ppm: [S2] s. 127; 850 ± 500 ppm: [S3] s. 3
      co2_kalite_esigi_ppm: 5000.0    # varsayım: istiridye CO2'ye en duyarlı tür olduğundan eşik istiridyeden düşük alınmadı [S1] s. 239
      co2_sekil_bozulma_ppm: 10000.0  # varsayım (aynı gerekçe)
      kaynak: "[S1] s. 239; [S2] s. 127; [S3] s. 3"
    biyoloji:
      biyolojik_verimlilik: [0.41, 1.07]  # meşe talaşında: [S2] Tablo 4 s. 130'dan türetilmiş (%41–46); [S4] Tablo S5 (%65–107)
      dalga_paylari: [0.58, 0.17, 0.25]   # [S2] Tablo 4, s. 130'dan türetilmiş
      pin_gun: 3.0                        # varsayım (pin + büyüme = 10 gün: [S2] Tablo 3)
      buyume_gun: 7.0                     # [S2] Tablo 3: meyve gelişimi 10 gün
      hasat_opt_yas_gun: 7.0              # şapka tamamen açılmadan hasat: [S3] s. 3; [S1] s. 242
      kalite_dusus_gun: 0.15              # varsayım
      curume_yas_gun: 11.0                # varsayım
      dinlenme_gun: 10.0                  # her dalga 20 gün: [S3] s. 3'ten türetilmiş (20 − 10)
      maks_gun: 200.0                     # 129 gün [S2], 160 gün [S3]
      tur: literatur_ve_varsayim

  aslan_yelesi:                # Hericium erinaceus
    inkubasyon:
      sicaklik_opt: [23.0, 27.0]      # 25 °C: [H1] s. 2; 25 ± 2 °C: [H2] s. 3
      sicaklik_tolerans: 4.0          # varsayım
      sure_gun: 35.0                  # 30–40 gün: [H2] s. 3
      co2_maks_ppm: null
      kolonizasyon_esigi: 0.90        # varsayım
      kaynak: "[H1] s. 2; [H2] s. 3"
    kahverengilesme: null
    meyvelenme:
      sicaklik_opt: [15.0, 20.0]      # 15/20/25 °C deneyi, 20 °C üstü sınırlayıcı: [H1] s. 1-2, Tablo 3; 15–20 °C: [H3]
      sicaklik_tolerans: 3.0          # varsayım
      sus_sicaklik_kaymasi_c: 3.0     # bazı izolatlar 25 °C'de meyve vermiyor, bazıları veriyor: [H1]; 18–24 °C: [H2]
      nem_opt: [85.0, 95.0]           # %85–90: [H1] s. 2; %90–95: [H2] s. 3
      nem_tolerans: 8.0               # varsayım
      co2_iyi_maks_ppm: 1000.0        # < 1000 ppm: [H1] s. 2
      co2_kalite_esigi_ppm: 5000.0    # varsayım (kaynak aranacak)
      co2_sekil_bozulma_ppm: 10000.0  # varsayım (kaynak aranacak)
      kaynak: "[H1] s. 2; [H2] s. 3; [H3]"
    biyoloji:
      biyolojik_verimlilik: [0.30, 0.85]  # [H1] %18–32 (2 dalga) ... [H3] %83–85; [H2]'den türetilmiş 1. dalga %48–69
      dalga_paylari: [0.65, 0.35]         # 2 dalga: [H1] s. 2; paylar varsayım
      pin_gun: 20.0                       # taslak oluşumu 17–28 gün: [H2] s. 3 ([H1]'de daha kısa)
      buyume_gun: 8.0                     # 7–10 gün: [H2] s. 3
      hasat_opt_yas_gun: 8.0              # sararmadan önce hasat: [H1] s. 2
      kalite_dusus_gun: 0.15              # varsayım
      curume_yas_gun: 12.0                # varsayım
      dinlenme_gun: 10.0                  # varsayım
      maks_gun: 120.0
      tur: literatur_ve_varsayim

risk:                          # kontaminasyon tehlike oranı (günlük olasılık)
  temel_gunluk: 0.002
  yuksek_nem_esigi: 95.0
  yuksek_nem_katsayi: 0.01     # eşiğin üstündeki her %1 için
  yuksek_sicaklik_esigi: 30.0
  yuksek_sicaklik_katsayi: 0.004
  kayip_orani: 0.3             # olayda kalan verim kapasitesinin kaybolan oranı
  tur: varsayim

ekonomi:                       # TODO: güncel tarifelerden alınacak (tarih ve kaynakla)
  mantar_tl_kg: 60.0
  elektrik_tl_kwh: 4.0
  su_tl_litre: 0.05
  tur: gecici

odul:
  olcek_tl: 100.0              # ödül = TL / olcek_tl
  ihlal_ceza: 0.5              # ayar aralığından tolerans kadar sapılan her adım için
  erken_sok_ceza: 0.2
  tur: varsayim

co2_buyume:                    # CO2'nin büyümeye etkisi kademeli başlar: dış hava düzeyinden itibaren şapka küçülür [13] s. 156
  erken_etki: 0.2              # iyi_maks düzeyinde büyümedeki azalma (varsayım)
  tur: varsayim

rastgelelik:
  sus_kaymasi: true            # meyvelenme sıcaklık aralığı her bölümde suş farkı kadar kaydırılır
  verimlilik_araligi: true     # biyolojik verimlilik her bölümde aralıktan örneklenir

eylem_sinirlari:               # ajanın verebileceği ayar noktası aralıkları
  sicaklik_c: [8.0, 30.0]
  bagil_nem: [60.0, 98.0]
  co2_ppm: [500.0, 8000.0]

egitim:                        # K2'de doldurulacak
  algoritma: ppo
  toplam_adim: null
  ogrenme_orani: null
  gamma: null
  gae_lambda: null
  clip_eps: null
